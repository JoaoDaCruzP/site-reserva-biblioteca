<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth">
    <main class="card">
        <div class="logo">🏫</div>
        <h1>Reserva de Salas</h1>
        <p class="subtitulo">Entre para reservar seu horário</p>
        <form>
            <div>
                <label for="login">Email</label>
                <input type="email" name="login" id="login" placeholder="voce@email.com" required>
            </div>
            <div>
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha" placeholder="••••••" required>
            </div>
            <button type="button" class="btn btn-login">ENTRAR</button>
            <a class="link" href="cadastro.html">Não tem conta? Cadastre-se</a>
        </form>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
